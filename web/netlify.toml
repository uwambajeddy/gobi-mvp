# Netlify builds the Next.js app with its Next.js runtime (detected automatically).
# Environment: NEXT_PUBLIC_API_URL, NEXTAUTH_URL, NEXTAUTH_SECRET and the
# Google Maps keys are set on the site, not in this file.
[build]
  command = "npm run build"
  publish = ".next"

# Declared explicitly: Git builds only add the Next.js runtime on their own for
# sites created in the Netlify UI, and without it the site serves nothing but 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
