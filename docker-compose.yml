name: gobi-mvp

services:
  db:
    image: postgres:16-alpine
    container_name: gobi-mvp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gobi
      POSTGRES_PASSWORD: gobi
      # Default DB is "gobi"; dev + test databases are created by the init script
    ports:
      # Host 5433 to avoid clashing with a locally installed PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - gobi_mvp_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gobi_mvp_pgdata:
